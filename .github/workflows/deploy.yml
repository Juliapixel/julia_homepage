name: "Deploy to my website"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: "8192"
          mnt-safe-haven: "4096"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'pnpm-lock.yaml') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-

      - run: nix build -L
      - name: save build output
        uses: actions/upload-artifact@v4
        with:
          name: build_output
          path: result
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download build
        uses: actions/download-artifact@v4
        with:
          name: build_output
          path: build
      - name: deploy to vps
        env:
          SSH_RSA_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$SSH_RSA_KEY" > actions_rsa;
          chmod 600 actions_rsa;
          rsync -azv --chown=root:homepage_dev --chmod=D775,F664 --del -O -e "ssh -o StrictHostKeyChecking=no -i actions_rsa" ./build/* github_actions@${{ secrets.VPS_IP }}:/var/www/homepage
